# =====================================================================
# Intranet Salmones Antártica — configuración de Apache (XAMPP)
# Se incluye al final de C:\xampp\apache\conf\httpd.conf con:
#   Include "C:/xampp/htdocs/INTRANET/apache/intranet.conf"
# Solo se publican las carpetas public y los assets comunes.
# =====================================================================

Alias /intranet-assets "C:/xampp/htdocs/INTRANET/comun/assets"
Alias /intranet        "C:/xampp/htdocs/INTRANET/portal/public"
Alias /egresos         "C:/xampp/htdocs/INTRANET/egresos/public"

# Nada de INTRANET es visible desde el navegador...
<Directory "C:/xampp/htdocs/INTRANET">
    Require all denied
    Options -Indexes
    AllowOverride None
</Directory>

# ...salvo estas carpetas.
<Directory "C:/xampp/htdocs/INTRANET/portal/public">
    Require all granted
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php
</Directory>

<Directory "C:/xampp/htdocs/INTRANET/egresos/public">
    Require all granted
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.php
</Directory>

<Directory "C:/xampp/htdocs/INTRANET/comun/assets">
    Require all granted
    Options -Indexes
    AllowOverride None
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</Directory>

# La raíz del servidor lleva a la intranet.
RedirectMatch 302 ^/$ /intranet/

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
